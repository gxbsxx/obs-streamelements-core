name: Build (fork, Windows only)

# Minimal Windows build for this fork: no Google/GCS auth, no symbol upload,
# no installer. Produces the plugin DLL as a downloadable artifact.
# Crash handler is "none" so a locally patched build never reports to
# StreamElements' Sentry project, and OBS's own crash handler stays in charge.

on:
  push:
    branches:
      - master
      - fix/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025-vs2026
    env:
      CHECKOUT: 32.2.1
      BUILD_OPTIONS: >-
        -DENABLE_DECKLINK=OFF -DENABLE_SYPHON=OFF -DENABLE_LIBFDK=OFF
        -DENABLE_NVENC=OFF -DENABLE_QSV11=OFF -DENABLE_VST=OFF
        -DENABLE_WEBRTC=OFF -DENABLE_WEBSOCKET=OFF -DENABLE_OSS=OFF
        -DENABLE_SNDIO=OFF -DENABLE_VLC=OFF -DENABLE_VIRTUALCAM=OFF
        -DENABLE_TEST_INPUT=OFF -DENABLE_AJA=OFF -DENABLE_SCRIPTING=OFF
        -DENABLE_SCRIPTING_LUA=OFF -DENABLE_UI=OFF
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Clone OBS Studio
        shell: cmd
        run: |
          mkdir C:\local
          git clone --recursive --depth 1 --branch %CHECKOUT% --shallow-submodules https://github.com/obsproject/obs-studio.git C:\local\obs-studio

      - name: Install plugin into OBS tree
        shell: cmd
        run: |
          mkdir C:\local\obs-studio\plugins\obs-streamelements-core
          xcopy "%GITHUB_WORKSPACE%\*.*" "C:\local\obs-studio\plugins\obs-streamelements-core" /S /E /I /Y
          echo add_obs_plugin(obs-streamelements-core) > C:\local\obs-studio\plugins\CMakeLists.txt

      - name: Version
        shell: powershell
        run: |
          "#define STREAMELEMENTS_PLUGIN_VERSION 20261006001039L" |
            Out-File C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp

      - name: Configure
        shell: cmd
        run: |
          copy C:\local\obs-studio\plugins\obs-streamelements-core\CMakeUserPresets.json C:\local\obs-studio\CMakeUserPresets.json
          del C:\local\obs-studio\plugins\obs-streamelements-core\CMakeUserPresets.json
          cd /d C:\local\obs-studio
          cmake --preset=windows-x64-streamelements -DSTREAMELEMENTS_CRASH_HANDLER=none %BUILD_OPTIONS%

      - name: Build
        shell: cmd
        run: |
          cd /d C:\local\obs-studio
          cmake --build build_x64 --config RelWithDebInfo --target obs-streamelements-core

      - uses: actions/upload-artifact@v4
        with:
          name: obs-streamelements-core-parcheado
          path: |
            C:\local\obs-studio\build_x64\rundir\RelWithDebInfo\obs-plugins\64bit\obs-streamelements-core.dll
            C:\local\obs-studio\build_x64\rundir\RelWithDebInfo\obs-plugins\64bit\obs-streamelements-core.pdb
          if-no-files-found: error

      # En master: empaqueta (carpeta dentro del zip) y publica en Releases si esa versión aún no existe.
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v26.10.6.1039-arreglo1
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) { "$env:TAG ya estaba publicada"; exit 0 }
          $d = "C:\local\SE.Live-arreglado"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item C:\local\obs-studio\build_x64\rundir\RelWithDebInfo\obs-plugins\64bit\obs-streamelements-core.dll, C:\local\obs-studio\build_x64\rundir\RelWithDebInfo\obs-plugins\64bit\obs-streamelements-core.pdb, .github\LEEME.txt $d
          Compress-Archive -Path $d -DestinationPath C:\local\SE.Live-arreglado.zip
          gh release create $env:TAG C:\local\SE.Live-arreglado.zip --target $env:GITHUB_SHA --title "SE.Live 26.10.6.1039 arreglado: OBS ya no se congela con el lienzo vertical" --notes-file .github/RELEASE_FORK.md
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la versión" }
